name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out pinned official Codex validators
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openai/codex
          ref: 0e9a2bae5286334aab64946bab1f49c216a9906c
          path: .codex-validator-source
          sparse-checkout: codex-rs/skills/src/assets/samples
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: runtime/requirements-ci.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux document tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils tesseract-ocr tesseract-ocr-rus unar
      - name: Install macOS document tools
        if: runner.os == 'macOS'
        run: brew install poppler tesseract-lang unar
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r runtime/requirements-ci.lock
          npm ci
      - name: Validate plugin and skill
        run: |
          python .codex-validator-source/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py skills/smetchik
          python .codex-validator-source/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py .
      - name: Run full test suite
        run: python -m pytest -p no:cacheprovider -q

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux document tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils tesseract-ocr tesseract-ocr-rus unar
      - name: Install macOS document tools
        if: runner.os == 'macOS'
        run: brew install poppler tesseract-lang unar
      - name: Build and verify isolated runtime
        run: |
          python runtime/bootstrap.py --runtime-dir "${{ runner.temp }}/st67-smetchik-runtime"
          python runtime/bootstrap.py --runtime-dir "${{ runner.temp }}/st67-smetchik-runtime" --verify-only

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: python
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
